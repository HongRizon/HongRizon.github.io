<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found | SeungBin Hong</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
:root{--paper:#fafaf8;--ink:#1f2933;--muted:#5a6670;--line:#d6dcdf;--accent:#27506f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141a20;--ink:#e8edf0;--muted:#a9b5be;--line:#334049;--accent:#a9cbe6;color-scheme:dark}}
html{background:var(--paper)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;padding:48px clamp(20px,4vw,56px)}
p.code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);margin:0 0 16px}
h1{font:clamp(1.75rem,1.2rem + 1.5vw,2.5rem)/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Charter,Georgia,serif;letter-spacing:-.02em;margin:0 0 16px}
p{margin:0 0 24px;color:var(--muted);max-width:52ch}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:.22em}
a:hover{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<h1>There is nothing at this address.</h1>
<p>The page may have moved, or the link was mistyped. Everything on this site lives on one page.</p>
<a href="/">Go to the front page</a>
</main>
</body>
</html>
